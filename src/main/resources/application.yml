spring:
  application:
    name: lan-ai-code-mother-backend
  # session 配置
  session:
    store-type: redis
    # session 7 天过期
    timeout: 604800
  # mysql - 具体配置在 profile 文件中（application-local.yml 或 application-prod.yml）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # redis - 具体配置在 profile 文件中
  data:
    redis:
  profiles:
    active: local
    rabbitmq:
      host:
      port:
      username:
      password:
      virtual-host:
      # 发布确认（保证消息不丢失）
      publisher-confirm-type: correlated
      publisher-returns: true

    # 消费者配置
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认
        concurrency: 5            # 初始消费者数
        max-concurrency: 10       # 最大消费者数
        prefetch: 1               # 预取数量（公平分发）
        retry:
          enabled: true           # 开启重试
          max-attempts: 3         # 最大重试次数
          initial-interval: 2000  # 初始重试间隔
          multiplier: 2           # 重试间隔倍数
          max-interval: 10000     # 最大重试间隔

    # 消息转换器（JSON）
    template:
      default-receive-queue: default-queue
      mandatory: true             # 消息无法路由时返回给生产者

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 7 天过期
    session:
      cookie:
        max-age: 604800

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lanhai.lanaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 应用配置 - 具体配置在 profile 文件中（application-local.yml 或 application-prod.yml）
app:
  admin:
    register-password:
  # 应用部署域名（包含端口号）
  code:
    deploy-host: http://localhost:8123
