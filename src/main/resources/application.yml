spring:
  application:
    name: lan-ai-code-mother-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql - 具体配置在 profile 文件中（application-local.yml 或 application-prod.yml）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # redis - 具体配置在 profile 文件中
  data:
    redis:
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lanhai.lanaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 应用配置 - 具体配置在 profile 文件中（application-local.yml 或 application-prod.yml）
app:
  admin:
    register-password:
